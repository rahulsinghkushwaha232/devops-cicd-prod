name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run lint (syntax check)
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-scan-push:
    name: Build, Scan & Push
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-cicd-prod:local

      - name: Scan image for HIGH vulnerabilities (log only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-cicd-prod:local
          format: table
          severity: HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan image for CRITICAL vulnerabilities (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-cicd-prod:local
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-prod:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-prod:latest

      - name: Build & Scan Summary
        if: always()
        run: |
          echo "### Build & Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ env.HAS_DOCKERHUB }}" = "true" ]; then
            echo "- **Status:** Successfully built, scanned with Trivy, and pushed to Docker Hub." >> $GITHUB_STEP_SUMMARY
            echo "- **Tags:** \`${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-prod:${{ github.sha }}\` and \`latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** Image built and security scan passed." >> $GITHUB_STEP_SUMMARY
            echo "- **Docker Hub Push:** Skipped (push occurs only on push to main when DOCKERHUB_TOKEN secret is configured)." >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    name: Deploy to Server
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_SERVER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH with Health Check & Rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          TARGET_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" bash -s "$TARGET_TAG" << 'EOF'
            set -e
            TARGET_TAG="$1"
            cd ~/app

            echo "Target deployment tag: $TARGET_TAG"
            export IMAGE_TAG="$TARGET_TAG"
            docker compose pull
            docker compose up -d

            echo "Checking container health (timeout: 60s)..."
            STATUS="unhealthy"
            for i in $(seq 1 12); do
              HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' devops_app 2>/dev/null || echo '"starting"')
              if [ "$HEALTH" = '"healthy"' ]; then
                STATUS="healthy"
                break
              fi
              echo "Attempt $i/12: Container health is $HEALTH. Waiting 5s..."
              sleep 5
            done

            if [ "$STATUS" = "healthy" ]; then
              echo "Deployment successfully verified as healthy!"
              echo "$TARGET_TAG" > .last_good_tag
            else
              echo "Container health check timed out / failed!"
              if [ -f .last_good_tag ]; then
                ROLLBACK_TAG=$(cat .last_good_tag)
                echo "Rolling back to .last_good_tag: $ROLLBACK_TAG"
                export IMAGE_TAG="$ROLLBACK_TAG"
                docker compose up -d
              else
                echo "No .last_good_tag found for rollback."
              fi
              exit 1
            fi
          EOF

      - name: Deployment Summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Status:** Successfully deployed commit \`${{ github.sha }}\`." >> $GITHUB_STEP_SUMMARY
            echo "- **Health Check:** Container verified healthy within 60s." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** Deployment failed or timed out during health check." >> $GITHUB_STEP_SUMMARY
            echo "- **Rollback:** Rolled back to previous \`.last_good_tag\` if available." >> $GITHUB_STEP_SUMMARY
          fi
